# Каждая арена резервируется на один бой DEATH или TEAM.
# Создайте площадку и защитите блоки отдельным плагином защиты региона.
arenas:
  # Уникальное имя арены. Можно добавить другие секции по этому образцу.
  example:
    # Включайте только после настройки мира, границ и безопасных точек.
    enabled: false
    world: world

    # Противоположные углы области: [X, Y, Z].
    min: [-20, 60, -20]
    max: [20, 90, 20]

    # Точки появления первой и второй стороны: [X, Y, Z].
    # Обе точки должны находиться внутри границ, над твёрдым блоком.
    # В TEAM оба участника одной команды появляются в одной точке.
    first: [-10, 65, 0]
    second: [10, 65, 0]
