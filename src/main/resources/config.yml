# Время подготовки после нахождения соперника, в секундах.
cooldown: 5

armor:
  # Сколько надетых элементов из allowed требуется: от 1 до 4.
  # 1 разрешает вход даже с одним алмазным элементом; материалы можно смешивать.
  minimum-pieces: 1
  allowed:
    - DIAMOND
    - NETHERITE

random:
  # Загруженный мир для обычного 1v1.
  world: world
  # Координаты X/Z выбираются вокруг нуля в пределах этого радиуса.
  radius: 1000
  # Максимальное количество попыток найти безопасную поверхность, не более 256.
  attempts: 64

combat:
  # Повторная выдача боевого КД на смертельной арене, в секундах.
  refresh-seconds: 5
  # Консольные команды GreatCombat без /. %player% заменяется ником.
  # Укажите реальные команды своей версии GreatCombat.
  # Пустой список означает, что внешний боевой КД не выдаётся.
  # В обычном 1v1 команды выполняются один раз, на арене — повторяются.
  start-commands: []
  # Команды при завершении или отмене боя, например снятие боевого КД.
  end-commands: []
