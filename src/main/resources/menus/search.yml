# Цвета: &a, &l, &r и HEX &#FFAA00. Пример: '[message] &#FFAA00Привет &fигрок!'.
# size: 9, 18, 27, 36, 45 или 54. Нумерация slot начинается с 0.
# material — материал Bukkit; name — имя предмета; lore — строки описания.
# Цвета поддерживают коды &. Каждое действие — отдельная строка в кавычках.
# [queue] NORMAL / DEATH / TEAM — начать поиск соответствующего боя.
# [leave] — отменить поиск; [close] — закрыть меню.
# [message] текст, [title] текст, [subtitle] текст, [actionbar] текст — вывод сообщений.
# title и subtitle из одного списка показываются вместе после остальных действий.
# Старый формат 'QUEUE: NORMAL' также поддерживается.
title: '&8DeathPvP | Поиск сражения'
size: 27

items:
  normal:
    slot: 11
    material: IRON_SWORD
    name: '&aБой 1v1'
    lore:
      - '&7Сражение в случайной точке мира'
    actions:
      - '[queue] NORMAL'
      - '[close]'

  death:
    slot: 13
    material: DIAMOND_SWORD
    name: '&cСмертельная битва'
    lore:
      - '&7Арена до смерти одного игрока'
    actions:
      - '[queue] DEATH'
      - '[close]'

  team:
    slot: 15
    material: NETHERITE_SWORD
    name: '&6Бой 2v2'
    lore:
      - '&7Смертельная битва команд'
    actions:
      - '[queue] TEAM'
      - '[close]'

  leave:
    slot: 22
    material: BARRIER
    name: '&cОтменить поиск'
    actions:
      - '[leave]'
      - '[close]'
