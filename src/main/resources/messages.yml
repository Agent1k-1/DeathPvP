# Каждая секция — список actions. Действия пишутся в кавычках, каждое с новой строки.
# [message] текст — сообщение в чат; можно указать несколько строк.
# [title] текст — заголовок, [subtitle] текст — подзаголовок.
# Заголовок и подзаголовок из одного списка показываются вместе.
# [actionbar] текст — сообщение над панелью быстрого доступа.
# Цветовые коды: &a, &c и другие. Пустой список [] отключает сообщение.
# %time% — секунды в countdown; %player% — приглашающий игрок в invite.
# Имена секций не переименовывайте. Старый формат полей поддерживается для совместимости.

armor:
  - '[message] &cВы не можете пойти PvP в этой броне. Нужен хотя бы один алмазный или незеритовый элемент.'

queued:
  - '[message] &aВы добавлены в очередь. /pvp leave — выйти.'

left:
  - '[message] &eПоиск отменён.'

busy:
  - '[message] &cИгрок уже занят или недоступен.'

team:
  - '[message] &aПати создана.'

invite:
  - '[message] &e%player% приглашает вас: /pvp team accept %player%'

party-required:
  - '[message] &cДля 2v2 нужна пати из двух игроков.'

countdown:
  - '[title] &c%time%'
  - '[subtitle] &fДо сражения'
  - '[actionbar] &eПриготовьтесь!'

start:
  - '[title] &cВ бой!'

win:
  - '[title] &aПобеда!'

cancel:
  - '[message] &cБой отменён: игрок недоступен, броня изменена или место недоступно.'

reload:
  - '[message] &aКонфигурация перезагружена.'
